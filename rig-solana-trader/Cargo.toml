[package]
name = "rig-solana-trader"
version = "0.1.0"
edition = "2021"

[dependencies]
# Framework
rig-core = { path = "../rig-core", features = ["derive", "pdf", "all"] }
rig-mongodb = { path = "../rig-mongodb" }

# Core dependencies
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Environment
dotenv = "0.15"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
base64 = "0.21"
rand = "0.8"

# Solana
solana-sdk = "1.17"
solana-client = "1.17"
solana-program = "1.17"
anchor-client = "0.29"

# DEX integration
# Using Jupiter via HTTP API instead of direct SDK
serde_qs = "0.12"  # For query string serialization
url = "2.4"        # For URL manipulation

# Social media integration
twitter-v2 = "0.1"
oauth2 = "4.4"

# OpenAI
openai = { version = "1.0.0-alpha.18" }

# New dependencies
oauth1 = "1.0"
anchor-lang = "0.29"

# MongoDB
mongodb = { version = "3.2.0", features = ["bson-chrono-0_4"] }
bincode = "1.3.3"

[dev-dependencies]
tokio-test = "0.4"
